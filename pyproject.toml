[project]
name = "scfbuild"
version = "3.0.0"
description = "SVGinOT Color Font Builder"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fonttools>=4.40.0",
    "PyYAML>=5.1",
    "ufoLib2>=0.16.0",
    "ufo2ft>=2.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.4.2",
]

[project.scripts]
scfbuild = "scfbuild.main:main"
